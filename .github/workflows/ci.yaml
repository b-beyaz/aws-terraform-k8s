name: ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/k3s-gitops-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kısa SHA üret
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Manifest etiketini güncelle
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}|" k8s/deployment.yaml

      - name: Git kimliği ayarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Değişikliği commit et ve push et
        run: |
          git add helm/flask-demo/values.yaml
          git commit -m "ci: image tag ${{ steps.vars.outputs.tag }}"
          git push