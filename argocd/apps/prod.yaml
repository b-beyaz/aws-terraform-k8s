apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-demo-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/b-beyaz/aws-terraform-k8s.git
    targetRevision: main
    path: helm/flask-demo
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m