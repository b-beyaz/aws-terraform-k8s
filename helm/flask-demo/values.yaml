replicaCount: 2

image:
  repository: ghcr.io/b-beyaz/k3s-gitops-demo
  tag: "36830d4"

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

pdb:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

probes:
  startup:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 2
    failureThreshold: 15
  readiness:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 5
    failureThreshold: 2
  liveness:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 10
    failureThreshold: 5